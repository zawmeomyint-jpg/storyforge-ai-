services:
  - type: web
    name: storyforge-ai-api
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4.1-mini
      - key: CLIENT_ORIGIN
        sync: false
      - key: MAX_UPLOAD_MB
        value: "500"
